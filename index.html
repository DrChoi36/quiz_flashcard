<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEWSTART Quiz</title>
    <style>
        /* 1. 기본 스타일 */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* height 대신 min-height 사용 */
            margin: 0;
            flex-direction: column;
            padding: 20px; /* 모바일 여백 확보 */
            box-sizing: border-box;
        }

        /* 2. 메인 컨테이너 (세로 정렬로 변경) */
        #quiz-container {
            display: flex;
            flex-direction: column; /* [중요] 세로 정렬 */
            align-items: center;
            gap: 30px; /* 카드와 버튼 사이 간격 */
            position: relative;
            width: 100%;
        }

        /* 3. 카드 영역 (반응형 크기 적용) */
        .card-wrapper {
            perspective: 1000px;
            width: 100%;       /* 모바일 기본 */
            max-width: 500px;  /* PC 최대 크기 제한 */
            height: 300px;     /* 높이 고정 (필요시 auto로 변경 가능) */
            cursor: pointer;
            position: relative;
        }

        /* 카드 번호 표시 */
        #card-counter {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.1rem;
            font-weight: bold;
            color: #555;
            background-color: #e9ecef;
            padding: 5px 15px;
            border-radius: 15px;
            white-space: nowrap;
        }

        /* 4. 실제 카드 */
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .card-inner.flipped {
            transform: rotateY(180deg);
        }

        /* 5. 앞/뒷면 공통 */
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px; /* 패딩 약간 축소 */
            box-sizing: border-box;
            border-radius: 15px;
            background-color: white;
            border: 1px solid #ddd;
        }

        .card-front {
            z-index: 2;
            transform: rotateY(0deg);
        }
        
        .card-back {
            transform: rotateY(180deg);
            background-color: #fafafa;
        }

        /* 텍스트 스타일 */
        .question-text {
            font-size: 1.3rem; /* 모바일 고려하여 폰트 사이즈 조정 */
            font-weight: bold;
            color: #333;
            line-height: 1.5;
            word-break: keep-all;
        }

        .answer-text {
            font-size: 1.1rem;
            color: #555;
            line-height: 1.6;
            word-break: keep-all;
        }

        .label {
            font-size: 0.8rem;
            color: #999;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        /* [새로 추가됨] 버튼 컨테이너 */
        .button-container {
            display: flex;
            gap: 40px; /* 버튼 사이 간격 */
            justify-content: center;
            width: 100%;
        }

        /* 6. 네비게이션 버튼 (크기 확대) */
        .nav-btn {
            padding: 0;
            width: 60px;  /* 터치하기 편하게 크기 확대 */
            height: 60px;
            border-radius: 50%;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 1.8rem;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.3s, transform 0.1s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .nav-btn:hover {
            background-color: #0056b3;
        }

        .nav-btn:active {
            transform: scale(0.95);
        }

        /* 7. 안내 및 완료 화면 */
        .instructions {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #888;
            background: #e9ecef;
            padding: 8px 20px;
            border-radius: 20px;
            text-align: center;
            line-height: 1.5;
        }

        #completion-message {
            display: none;
            text-align: center;
            animation: fadeIn 0.5s;
        }

        #completion-message h1 {
            color: #28a745;
            margin-bottom: 20px;
        }

        #restart-btn {
            padding: 10px 20px;
            font-size: 1rem;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* 돌아가기 링크 스타일 */
        .back-link {
            margin-top: 20px;
            color: #888;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="quiz-container">
        
        <div class="card-wrapper" onclick="flipCard()">
            <div id="card-counter">1 / 30</div>

            <div class="card-inner" id="card-inner">
                <div class="card-face card-front">
                    <div class="label">Question</div>
                    <div class="question-text" id="question-text">Loading...</div>
                </div>
                <div class="card-face card-back">
                    <div class="label">Answer & Explanation</div>
                    <div class="answer-text" id="answer-text">Loading...</div>
                </div>
            </div>
        </div>

        <div class="button-container">
            <button class="nav-btn" onclick="prevCard()">❮</button>
            <button class="nav-btn" onclick="nextCard()">❯</button>
        </div>

    </div>

    <div class="instructions" id="instructions">
        카드 터치: 정답 확인<br>
        화살표 버튼: 이전 / 다음 문제
    </div>
    
    <a href="../index.html" class="back-link">← 포트폴리오 메인으로 돌아가기</a>

    <div id="completion-message">
        <h1>Thank You!</h1>
        <p>모든 학습을 완료했습니다.</p>
        <br>
        <button id="restart-btn" onclick="restartQuiz()">처음으로 돌아가기</button>
        <br><br>
        <a href="../index.html" class="back-link">메인으로 나가기</a>
    </div>

    <script>
        // ==========================================
        // 5개 문제 데이터 (JSON)
        // ==========================================
        const quizData = [
            {
        "question": "합성곱(convolution) 연산은 각 배열의 원소끼리 어떻게 계산하나요?",
        "answer": "각 배열의 원소끼리 곱한 후 더합니다."
    },
    {
        "question": "합성곱 연산에서 미끄러지는 배열의 간격을 조절하는 것을 무엇이라 하나요?",
        "answer": "스트라이드(stride)입니다."
    },
    {
        "question": "원본 배열의 양 끝에 빈 원소를 추가하는 것을 무엇이라 하나요?",
        "answer": "패딩(padding)입니다."
    },
    {
        "question": "원본 배열에 패딩을 추가하지 않고 커널이 배열의 끝으로 갈 때까지 계산하는 방식은?",
        "answer": "밸리드 패딩(valid padding)입니다."
    },
    {
        "question": "Conv2D 층을 통과한 출력 데이터의 차원 수는?",
        "answer": "4차원 (배치, 높이, 너비, 필터 수)입니다."
    }
        ];

        // ==========================================
        // 로직
        // ==========================================
        let currentCardIndex = 0;
        const cardInner = document.getElementById('card-inner');
        const questionText = document.getElementById('question-text');
        const answerText = document.getElementById('answer-text');
        const cardCounter = document.getElementById('card-counter'); 
        
        const quizContainer = document.getElementById('quiz-container');
        const instructions = document.getElementById('instructions');
        const completionMessage = document.getElementById('completion-message');

        function loadCard(index) {
            // 카드 리셋
            cardInner.classList.remove('flipped');

            // 텍스트 업데이트
            setTimeout(() => {
                questionText.innerHTML = quizData[index].question;
                answerText.innerHTML = quizData[index].answer;
                
                // 카운터 업데이트
                cardCounter.textContent = `${index + 1} / ${quizData.length}`;
            }, 150);
        }

        function flipCard() {
            cardInner.classList.toggle('flipped');
        }

        function nextCard() {
            if (currentCardIndex < quizData.length - 1) {
                currentCardIndex++;
                loadCard(currentCardIndex);
            } else {
                finishQuiz();
            }
        }

        function prevCard() {
            if (currentCardIndex > 0) {
                currentCardIndex--;
                loadCard(currentCardIndex);
            }
        }

        function finishQuiz() {
            quizContainer.style.display = 'none';
            instructions.style.display = 'none';
            completionMessage.style.display = 'block';
        }

        function restartQuiz() {
            currentCardIndex = 0;
            quizContainer.style.display = 'flex'; 
            instructions.style.display = 'block';
            completionMessage.style.display = 'none';
            loadCard(0);
        }

        document.addEventListener('keydown', function(event) {
            if (quizContainer.style.display === 'none') return;

            if (event.code === 'Space') {
                event.preventDefault();
                flipCard();
            } else if (event.code === 'ArrowRight' || event.code === 'Enter') {
                event.preventDefault();
                nextCard();
            } else if (event.code === 'ArrowLeft') {
                event.preventDefault();
                prevCard();
            }
        });

        // 초기 실행
        loadCard(currentCardIndex);

    </script>
</body>

</html>
